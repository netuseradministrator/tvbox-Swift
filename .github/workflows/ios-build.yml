name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project tvbox.xcodeproj -scheme tvbox

      - name: Build iOS app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/build.log

      - name: Run iOS tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/TestDerivedData \
            -only-testing:tvbox-Tests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test.log

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/TVBox.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../TVBox-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-iOS-unsigned
          path: build/TVBox-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7
